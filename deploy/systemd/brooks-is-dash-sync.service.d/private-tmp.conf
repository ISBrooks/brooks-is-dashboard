[Service]
# The morning sync needs a writable temp folder. The unit runs with
# ProtectSystem=strict, which makes /tmp and /var/tmp read-only, and SQLite
# needs a temp file for any large multi-row write on a table that has the
# saved-results version triggers (tv_*). Without this, "DELETE FROM audit_daily"
# failed with "disk I/O error" (SQLITE_IOERR_GETTEMPPATH) on 2026-11-12 and
# 2026-11-13, and the whole 5 AM sync stopped at its first step.
# The web service (brooks-is-dash.service) already has the same setting.
PrivateTmp=true
